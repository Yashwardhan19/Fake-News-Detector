paths:
  data_dir: data/
  processed_dir: data/processed/
  models_dir: models/

features:
  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    sublinear_tf: true
    min_df: 2
    max_df: 0.95

  meta:
    # list of column names get_meta_features() returns
    columns:
      - char_count
      - word_count
      - sentence_count
      - exclamation_count
      - question_count
      - cap_word_count
      - avg_word_len
      - avg_sentence_len
      - quote_count
      - digit_ratio

training:
  test_size: 0.2
  random_state: 42

models:
  dir: models/
  plots_dir: models/plots/
  lr:
    C: 1.0
    max_iter: 3000
  rf:
    n_estimators: 200
    max_depth: null

credibility:
  # API key is loaded from .env file (GOOGLE_FACT_CHECK_API_KEY)
  # DO NOT put API keys in this file!
  max_results: 5
  
  trusted_sources:
    reuters.com: 0.95
    apnews.com: 0.95
    bbc.com: 0.90
    nytimes.com: 0.85
    theguardian.com: 0.85
    washingtonpost.com: 0.85
    ndtv.com: 0.75
    thehindu.com: 0.80
  
  untrusted_sources:
    infowars.com: 0.05
    naturalnews.com: 0.10
    beforeitsnews.com: 0.05