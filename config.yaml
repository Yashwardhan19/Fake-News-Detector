paths:
  data_dir: data/
  processed_dir: data/processed/
  models_dir: models/

features:
  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    sublinear_tf: true
    min_df: 2
    max_df: 0.95

  meta:
    # list of column names get_meta_features() returns
    columns:
      - char_count
      - word_count
      - sentence_count
      - exclamation_count
      - question_count
      - cap_word_count
      - avg_word_len
      - avg_sentence_len
      - quote_count
      - digit_ratio

training:
  test_size: 0.2
  random_state: 42

models:
  dir: models/
  plots_dir: models/plots/
  lr:
    C: 1.0
    max_iter: 3000
  rf:
    n_estimators: 200
    max_depth: null