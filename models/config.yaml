paths:
  data_dir: data/
  processed_dir: data/processed/
  models_dir: models/

features:
  tfidf:
    max_features: 50000
    ngram_range: [1, 2]
    sublinear_tf: true
    min_df: 2
    max_df: 0.95

  meta:
    # list of column names get_meta_features() returns
    columns:
      - char_count
      - word_count
      - sentence_count
      - exclamation_count
      - question_count
      - cap_word_count
      - avg_word_len
      - avg_sentence_len
      - quote_count
      - digit_ratio